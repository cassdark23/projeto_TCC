<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil do Usuário - FoxArena</title>
    <link rel="stylesheet" href="assets/css/paginas/perfil-usuario.css" />
  </head>
  <body>
    <header class="header">
        <a href="index.html" class="logo"> FoxArena </a>
  
        <nav class="nav">
          <a href="index.html">Página Inicial</a>
          <a href="login.html">Login</a>
          <a href="cadastro.html">Cadastro</a>
        </nav>
      </header>

    <main class="container">
      <section class="card-cadastro">
        <h1>Meu Perfil</h1>

        <form id="form-perfil">
          <!-- Campos somente leitura (não editáveis) -->
          <div class="campo">
            <label for="cpf">CPF</label>
            <input
              type="text"
              id="cpf"
              maxlength="14"
              placeholder="000.000.000-00"
              disabled
            />
          </div>

          <hr class="divisor" />

          <!-- Campos editáveis -->
          <div class="campo">
            <label for="nome">Nome Completo</label>
            <input
              type="text"
              id="nome"
              placeholder="Digite seu nome"
              required
            />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              placeholder="Digite seu e-mail"
              required
            />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              maxlength="15"
              placeholder="(11) 99999-9999"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Nova Senha -deixe em branco para manter-</label>
            <input
              type="password"
              id="senha"
              placeholder="Digite a nova senha"
            />
          </div>

          <div class="campo">
            <label for="confirmeSenha">Confirme a Nova Senha</label>
            <input
              type="password"
              id="confirmeSenha"
              placeholder="Confirme a nova senha"
            />
          </div>

          <button type="submit" class="btn-confirm">Salvar Alterações</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>© 2026 FoxArena - Sistema de Agendamento</p>
    </footer>

    <script type="module" src="./assets/js/paginas/perfil-usuario.js"></script>
  </body>
</html>
