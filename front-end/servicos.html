<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Serviço</title>
    <link rel="stylesheet" href="assets/css/paginas/servicos.css" />
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo"> FoxArena </a>

      <nav class="nav">
        <a href="index.html">Página Inicial</a>
        <a href="login.html">Login</a>
        <a href="cadastro.html">Cadastro</a>
      </nav>
    </header>
    <main class="container">
      <section class="card-cadastro">
        <h1>Cadastro de Serviço</h1>

        <form>
          <div class="campo">
            <label for="nome">Nome do Serviço</label>
            <input 
              type="text" 
              id="nome" 
              placeholder="Ex: Aluguel de Quadra Society" 
              required 
            />
          </div>

          <div class="campo">
            <label for="tipo">Tipo</label>
            <input 
              type="text" 
              id="tipo" 
              placeholder="Ex: Quadra, Campo, Salão" 
              required 
            />
          </div>

          <div class="campo">
            <label for="capacidade">Capacidade (Pessoas)</label>
            <input 
              type="number" 
              id="capacidade" 
              placeholder="Ex: 12" 
              min="1" 
            />
          </div>

          <div class="campo">
            <label for="valor_hora">Valor por Hora (R$)</label>
            <input 
              type="number" 
              id="valor_hora" 
              step="0.01" 
              placeholder="0.00" 
              required 
            />
          </div>
          
          <div class="campo">
            <label for="status">Status</label>
            <select id="status" required>
              <option value="ATIVO" selected>Ativo</option>
              <option value="INATIVO">Inativo</option>
            </select>
          </div>

          <button type="submit" class="btn-confirm">Cadastrar Serviço</button>
        </form>
      </section>
    </main>
    <footer class="footer">
      <p>© 2026 FoxArena - Sistema de Agendamento</p>
    </footer>
    <script type="module" src="./assets/js/paginas/servicos.js"></script>
  </body>
</html>
