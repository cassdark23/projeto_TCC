<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/paginas/login.css" />
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo"> FoxArena </a>

      <nav class="nav">
        <a href="index.html">Página Inicial</a>
        <a href="login.html">Login</a>
        <a href="cadastro.html">Cadastro</a>
      </nav>
    </header>

    <main class="container">
      <section class="card-login">
        <h1>Login</h1>

        <form>
          <div class="campo">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              placeholder="Digite seu e-mail"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <button type="submit" class="btn-confirm">Entrar</button>

          <p class="link">
            <a href="recuperar-senha.html">Esqueci minha senha</a>
          </p>

          <p class="link">
            Não possui cadastro?
            <a href="cadastro.html">Casdastre-se</a>
          </p>
        </form>
      </section>
    </main>
    <footer class="footer">
      <p>© 2026 FoxArena - Sistema de Agendamento</p>
    </footer>
    <script type="module" src="./assets/js/paginas/login.js"></script>
  </body>
</html>
